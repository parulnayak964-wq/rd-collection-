<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RD App - Mehsana</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f1f5f9;padding:10px}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{flex:1;padding:12px 5px;border:0;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;background:#e2e8f0}
.tabs button.active{background:#1e40af;color:#fff}
.card{background:#fff;padding:14px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
label{display:block;font-weight:700;font-size:13px;color:#334155;margin:12px 0 5px}
input,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}
.row{display:flex;gap:10px}.row>div{flex:1}
.btn{width:100%;background:#1e40af;color:#fff;border:0;padding:13px;border-radius:10px;font-weight:800;font-size:16px;margin-top:16px;cursor:pointer}
.btn2{flex:1;padding:10px;border:0;border-radius:8px;font-weight:700;color:#fff;cursor:pointer;font-size:13px}
.btnWA{width:100%;background:#25D366;color:#fff;border:0;padding:13px;border-radius:10px;font-weight:800;font-size:15px;margin-top:10px;cursor:pointer}
.cust{border:1px solid #e2e8f0;padding:12px;border-radius:10px;margin-top:10px}
.small{font-size:12px;color:#64748b}
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700}
.red{background:#fee2e2;color:#b91c1c}.green{background:#dcfce7;color:#166534}.orange{background:#ffedd5;color:#9a3412}
.del{color:red;background:none;border:0;float:right;font-weight:700}
.suggest{border:1px solid #cbd5e1;border-radius:8px;max-height:220px;overflow:auto;display:none;background:#fff}
.suggest div{padding:11px;border-bottom:1px solid #f1f5f9;cursor:pointer}
.selected{background:#dcfce7;padding:10px;border-radius:8px;font-weight:700;font-size:14px;margin-top:8px;display:none}
.backupBox{background:#fffbeb;border:1px solid #fde68a;padding:10px;border-radius:10px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left}
.checkRow{display:flex;align-items:center;gap:8px;margin-top:12px;background:#f0fdf4;padding:10px;border-radius:8px}
.checkRow input{width:20px;height:20px}
.statBox{flex:1;padding:10px;border-radius:10px;text-align:center}
</style>
</head>
<body>

<button class="btn2" style="background:#f59e0b" onclick="document.getElementById('importFile').click()">⬆️ Backup Wapas Lao</button>
<input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
</div></div>
